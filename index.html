<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quantum Survey Voxel GIS - ช่างเบิร์ดโคตรเฟี้ยว</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; color: #00ffcc; font-family: 'Courier New', monospace; }
        #view-container { position: relative; width: 100%; height: 100%; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; transition: opacity 0.6s ease; }
        #webgl-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: auto; opacity: 0; transition: opacity 0.6s ease; }
        .active-3d #webgl-canvas { opacity: 1; pointer-events: auto; }
        .active-3d #map { opacity: 0; pointer-events: none; }
        
        #hud { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(5, 5, 5, 0.85); padding: 15px; border: 1px solid #00ffcc; border-radius: 4px; pointer-events: auto; backdrop-filter: blur(5px); }
        h1 { font-size: 1rem; margin: 0 0 8px 0; color: #ff5555; letter-spacing: 1px; }
        p { font-size: 0.8rem; margin: 4px 0; color: #888; }
        .highlight { color: #00ffcc; }
        
        .control-group { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
        input { background: #111; border: 1px solid #444; color: #fff; padding: 6px; font-family: monospace; width: 110px; border-radius: 3px; }
        button { background: #00ffcc; color: #050505; border: none; padding: 6px 12px; font-weight: bold; cursor: pointer; border-radius: 3px; font-family: monospace; transition: 0.2s; }
        button:hover { background: #ff5555; color: #fff; }
    </style>
    <!-- Google Maps API (สมมติสัจจะ 2D Viewport) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>
</head>
<body>
    <div id="view-container">
        <div id="map"></div>
        <canvas id="webgl-canvas"></canvas>
        
        <div id="hud">
            <h1>[ โควตา: ปฐวีธาตุ Voxel GIS ]</h1>
            <p>Lat/Long: <span id="coords" class="highlight">18.7883, 98.9853 (เชียงใหม่)</span></p>
            <p>Frustum Culling: <span class="highlight">ACTIVE (สุญญตา)</span></p>
            <p>FPS: <span id="fps" class="highlight">60</span> | Mode: <span id="mode-text" class="highlight">2D MAP</span></p>
            <div class="control-group">
                <input type="text" id="lat-input" value="18.7883" placeholder="Lat">
                <input type="text" id="lng-input" value="98.9853" placeholder="Lng">
                <button id="transfer-btn">⚡ 3D TRANSITION</button>
            </div>
        </div>
    </div>

    <!-- Raw WebGL & Three.js CDN (เบาสลิว Zero-Payload) -->
    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';

        let map, marker, 3dActive = false;
        let renderer, scene, camera, voxelMesh, animationId;
        let lat = 18.7883, lng = 98.9853;

        window.initMap = function() {
            const chiangMai = { lat: lat, lng: lng };
            map = new google.maps.Map(document.getElementById('map'), {
                center: chiangMai,
                zoom: 15,
                disableDefaultUI: true,
                styles: [{ elementType: "geometry", stylers: [{ color: "#212121" }] }, { elementType: "labels.text.fill", stylers: [{ color: "#757575" }] }]
            });
            marker = new google.maps.Marker({ position: chiangMai, map: map, title: "ช่างเบิร์ดโคตรเฟี้ยว" });
            
            map.addListener('center_changed', () => {
                const center = map.getCenter();
                lat = center.lat();
                lng = center.lng();
                document.getElementById('coords').innerText = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                document.getElementById('lat-input').value = lat.toFixed(4);
                document.getElementById('lng-input').value = lng.toFixed(4);
            });
        };

        // Initialize WebGL 3D Voxel Contour Engine
        const canvas = document.getElementById('webgl-canvas');
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 50, 80);
        camera.lookAt(0, 0, 0);

        // สร้าง Voxel Quantum Cells (ปฐวีธาตุ Contour)
        const size = 60;
        const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
        
        // ใช้ InstancedMesh เพื่อประสิทธิภาพสูงสุด เมตตาฮาร์ดแวร์ 60FPS
        const count = size * size;
        voxelMesh = new THREE.InstancedMesh(geometry, material, count);
        voxelMesh.frustumCulled = true; // สุญญตา: นอกจอทำลายทิ้งทันที

        const dummy = new THREE.Object3D();
        let idx = 0;
        for (let x = 0; x < size; x++) {
            for (let z = 0; z < size; z++) {
                const px = (x - size / 2) * 1.2;
                const pz = (z - size / 2) * 1.2;
                const py = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 5;
                dummy.position.set(px, py, pz);
                dummy.updateMatrix();
                voxelMesh.setMatrixAt(idx++, dummy.matrix);
            }
        }
        scene.add(voxelMesh);

        // Animation Loop (The Flow State)
        let lastTime = performance.now();
        function animate() {
            animationId = requestAnimationFrame(animate);
            const now = performance.now();
            document.getElementById('fps').innerText = Math.round(1000 / (now - lastTime));
            lastTime = now;

            if (3dActive) {
                voxelMesh.rotation.y += 0.005;
            }
            renderer.render(scene, camera);
        }
        animate();

        // ⚡ ปุ่มทรานเฟอร์สลับโหมด 2D <-> 3D ตาแตก
        const btn = document.getElementById('transfer-btn');
        const container = document.getElementById('view-container');
        const modeText = document.getElementById('mode-text');

        btn.addEventListener('click', () => {
            3dActive = !3dActive;
            if (3dActive) {
                container.classList.add('active-3d');
                btn.innerText = "🗺️ BACK TO 2D MAP";
                modeText.innerText = "3D QUANTUM VOXEL";
            } else {
                container.classList.remove('active-3d');
                btn.innerText = "⚡ 3D TRANSITION";
                modeText.innerText = "2D MAP";
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
